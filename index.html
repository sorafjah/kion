<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>気温のグラフ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* 読みやすいUDフォントを全体に適用 */
    body {
      font-family: 'BIZ UDPGothic', sans-serif;
      background-color: #f0fdf4; /* 清潔感のあるごく薄い緑/青系の背景 */
      color: #334155;
    }
    /* グラフのY軸と表の見出し幅を合わせるための固定幅 */
    .y-axis-width {
      width: 90px;
      min-width: 90px;
    }
    input[type="date"], input[type="text"] {
      font-family: 'BIZ UDPGothic', sans-serif;
    }
    /* PCでのドラッグ操作時に文字が選択されないようにする */
    .select-none {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center">

  <div class="w-full max-w-5xl bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
    
    <h1 class="text-2xl md:text-3xl font-bold text-center text-slate-700 mb-6">
      気温のグラフ
    </h1>

    <p class="text-center text-slate-600 mb-8 text-lg leading-relaxed">
      場所は日本語か英語（ローマ字）で入力。海外の気温にも対応。<br>
      <span class="text-green-600 text-base font-bold">💡 グラフ・表を左右にスワイプ（ドラッグ）すると7日前まで戻れます</span>
    </p>

    <!-- 設定入力エリア -->
    <div class="flex flex-col md:flex-row items-center justify-center gap-4 mb-8 bg-slate-50 p-4 rounded-xl border border-slate-100">
      
      <div class="flex flex-col w-full md:w-auto">
        <label for="locationInput" class="text-sm font-bold text-slate-600 mb-1">場所</label>
        <input type="text" id="locationInput" value="渋谷" placeholder="例：渋谷" 
               class="p-3 border border-slate-300 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-green-400 w-full md:w-64">
      </div>

      <div class="flex flex-col w-full md:w-auto">
        <label for="dateInput" class="text-sm font-bold text-slate-600 mb-1">基準の日付</label>
        <input type="date" id="dateInput" 
               class="p-3 border border-slate-300 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-green-400 w-full md:w-48">
      </div>

      <div class="flex flex-col w-full md:w-auto mt-auto">
        <button id="fetchBtn" 
                class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg text-lg transition-colors shadow-sm">
          データを見る
        </button>
      </div>

    </div>

    <!-- メッセージ表示エリア -->
    <div id="messageArea" class="text-center text-lg font-bold min-h-[2rem] mb-4 text-slate-600">
      <!-- 取得中やエラーのメッセージがここに表示されます -->
    </div>

    <!-- 結果表示エリア（初期は非表示） -->
    <div id="resultArea" class="hidden">
      
      <div class="text-center mb-6">
        <h2 id="resultTitle" class="text-xl md:text-2xl font-bold text-slate-700 border-b-2 border-green-200 inline-block px-4 pb-2 transition-all">
          <!-- 〇〇の気温データ -->
        </h2>
        <div id="offsetBadge" class="text-sm font-bold text-orange-500 mt-2 hidden">
          <!-- 過去に遡っている時のバッジ表示 -->
        </div>
      </div>

      <!-- グラフと表のコンテナ（スワイプ・ドラッグの対象エリア） -->
      <div id="scrollContainer" class="w-full overflow-x-auto pb-4 cursor-grab select-none">
        <div style="min-width: 800px;"> <!-- タブレットやPCで綺麗に見える最小幅 -->
          
          <!-- グラフエリア -->
          <div class="h-80 mb-2 relative w-full pointer-events-none">
            <canvas id="temperatureChart"></canvas>
          </div>

          <!-- 表（テーブル）エリア -->
          <div id="temperatureTable" class="flex flex-col border-2 border-slate-200 rounded-lg overflow-hidden pointer-events-none">
            <!-- JavaScriptで中身を生成します -->
          </div>

        </div>
      </div>

    </div>

  </div>

  <script>
    // --- 初期設定 ---
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    const todayString = `${year}-${month}-${day}`;
    document.getElementById('dateInput').value = todayString;

    let chartInstance = null;
    
    // --- スワイプ機能のための状態管理 ---
    let fullWeatherData = null; // 15日分（8日前〜6日後）の全データを保持
    let fullBaseDateString = ''; // 検索した基準日
    let currentLocationName = ''; // 検索した場所
    let currentOffset = 0; // 現在の表示ズレ日数 (0 が基準日通り。最大 -6)

    // --- ボタンクリック時の処理 ---
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const location = document.getElementById('locationInput').value.trim();
      const dateString = document.getElementById('dateInput').value;
      const messageArea = document.getElementById('messageArea');
      const resultArea = document.getElementById('resultArea');

      if (!location) {
        messageArea.textContent = '場所を入力してください。';
        messageArea.className = 'text-center text-lg font-bold min-h-[2rem] mb-4 text-orange-500';
        return;
      }
      if (!dateString) {
        messageArea.textContent = '日付を選んでください。';
        messageArea.className = 'text-center text-lg font-bold min-h-[2rem] mb-4 text-orange-500';
        return;
      }

      messageArea.textContent = 'データを取得しています...';
      messageArea.className = 'text-center text-lg font-bold min-h-[2rem] mb-4 text-slate-600';
      resultArea.classList.add('hidden');

      try {
        // APIからデータを取得
        const data = await fetchWeatherData(location, dateString);
        
        fullWeatherData = data.daily;
        fullBaseDateString = dateString;
        currentLocationName = data.name;
        currentOffset = 0; // 新しく検索した時はオフセットを0に戻す
        
        updateDisplay(); // 描画処理
        
        resultArea.classList.remove('hidden');
        messageArea.textContent = ''; 
        
        // 検索直後はスクロール位置を左端にリセット
        document.getElementById('scrollContainer').scrollLeft = 0;
      } catch (error) {
        messageArea.textContent = error.message;
        messageArea.className = 'text-center text-lg font-bold min-h-[2rem] mb-4 text-orange-500';
      }
    });

    // --- 気象データの取得処理 (7日前まで戻れるよう長めに取得) ---
    async function fetchWeatherData(location, baseDateString) {
      // 1. 場所の名前から緯度・経度を取得
      const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=1&language=ja`);
      if (!geoRes.ok) throw new Error('通信エラーが発生しました。');
      const geoData = await geoRes.json();
      
      if (!geoData.results || geoData.results.length === 0) {
        throw new Error('場所が見つかりませんでした。「市・町・村」をつけるか、はずすか、ローマ字で入力してみてください。');
      }
      const { latitude, longitude, name } = geoData.results[0];

      // 2. 取得する期間の計算（最大7日前まで戻れるように、基準日の8日前 〜 6日後 ＝ 合計15日間取得）
      const baseDate = new Date(baseDateString);
      
      const startDate = new Date(baseDate);
      startDate.setDate(baseDate.getDate() - 8); // 8日前
      
      const endDate = new Date(baseDate);
      endDate.setDate(baseDate.getDate() + 6); // 6日後

      const startStr = `${startDate.getFullYear()}-${String(startDate.getMonth() + 1).padStart(2, '0')}-${String(startDate.getDate()).padStart(2, '0')}`;
      const endStr = `${endDate.getFullYear()}-${String(endDate.getMonth() + 1).padStart(2, '0')}-${String(endDate.getDate()).padStart(2, '0')}`;

      // 3. 気温データの取得
      const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&start_date=${startStr}&end_date=${endStr}`);
      if (!weatherRes.ok) throw new Error('天気データの取得に失敗しました。');
      const weatherData = await weatherRes.json();

      return {
        name: name,
        daily: weatherData.daily
      };
    }

    // --- オフセットに基づいて画面を更新する処理 ---
    function updateDisplay() {
      if (!fullWeatherData) return;

      // 基準日のインデックスを探す
      let baseIndex = fullWeatherData.time.findIndex(t => t === fullBaseDateString);
      if (baseIndex === -1) baseIndex = 8; // 万が一見つからない場合の安全策

      // 表示範囲を計算 (8日間分)
      // currentOffsetが -1 なら1日過去へずれる
      let startIndex = baseIndex - 1 + currentOffset;
      if (startIndex < 0) startIndex = 0; // 念のための範囲外ガード
      const endIndex = startIndex + 8;

      // 表示用のデータを切り出す
      const displayData = {
        time: fullWeatherData.time.slice(startIndex, endIndex),
        temperature_2m_max: fullWeatherData.temperature_2m_max.slice(startIndex, endIndex),
        temperature_2m_min: fullWeatherData.temperature_2m_min.slice(startIndex, endIndex)
      };

      // タイトルとバッジの更新
      const titleEl = document.getElementById('resultTitle');
      const badgeEl = document.getElementById('offsetBadge');
      
      titleEl.textContent = `${currentLocationName} の気温の変化`;
      if (currentOffset < 0) {
        badgeEl.textContent = `▶ 現在 ${Math.abs(currentOffset) + 1}日前 までのデータを表示中`;
        badgeEl.classList.remove('hidden');
      } else {
        badgeEl.classList.add('hidden');
      }

      // 描画実行
      renderChart(displayData);
      renderTable(displayData, fullBaseDateString);
    }

    // --- グラフの描画処理 ---
    function renderChart(dailyData) {
      const ctx = document.getElementById('temperatureChart').getContext('2d');
      
      if (chartInstance) {
        chartInstance.destroy(); // 以前のグラフを消去
      }

      const labels = dailyData.time.map(timeStr => {
        const d = new Date(timeStr);
        return `${d.getMonth() + 1}/${d.getDate()}`;
      });

      const fontFamily = "'BIZ UDPGothic', sans-serif";

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '最高気温 (℃)',
              data: dailyData.temperature_2m_max,
              borderColor: '#ef4444',
              backgroundColor: '#ef4444',
              borderWidth: 3,
              tension: 0.1,
              pointRadius: 6,
              pointHoverRadius: 8
            },
            {
              label: '最低気温 (℃)',
              data: dailyData.temperature_2m_min,
              borderColor: '#3b82f6',
              backgroundColor: '#3b82f6',
              borderWidth: 3,
              tension: 0.1,
              pointRadius: 6,
              pointHoverRadius: 8
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 300 }, // スワイプ時の再描画を少しスムーズに
          layout: {
            padding: { left: 0, right: 0, top: 10, bottom: 0 }
          },
          plugins: {
            legend: { position: 'top', labels: { font: { family: fontFamily, size: 14 } } },
            tooltip: { titleFont: { family: fontFamily, size: 14 }, bodyFont: { family: fontFamily, size: 14 } }
          },
          scales: {
            x: {
              offset: true,
              grid: { display: false },
              ticks: { font: { family: fontFamily, size: 14 } }
            },
            y: {
              beginAtZero: true,
              afterFit: function(scaleInstance) { scaleInstance.width = 90; },
              ticks: { font: { family: fontFamily, size: 14 }, stepSize: 5 }
            }
          }
        }
      });
    }

    // --- 表（テーブル）の生成処理 ---
    function renderTable(dailyData, baseDateString) {
      const tableContainer = document.getElementById('temperatureTable');
      tableContainer.innerHTML = ''; 

      const baseDate = new Date(baseDateString);
      baseDate.setHours(0, 0, 0, 0);
      
      const dateRow = document.createElement('div');
      dateRow.className = 'flex border-b border-slate-200 bg-slate-50';
      const maxRow = document.createElement('div');
      maxRow.className = 'flex border-b border-slate-200 bg-white';
      const minRow = document.createElement('div');
      minRow.className = 'flex bg-white';

      const headerClass = 'y-axis-width p-3 flex items-center justify-center font-bold text-sm md:text-base border-r border-slate-200 text-slate-700';
      dateRow.innerHTML = `<div class="${headerClass}">日付</div>`;
      maxRow.innerHTML = `<div class="${headerClass} text-red-600">最高(℃)</div>`;
      minRow.innerHTML = `<div class="${headerClass} text-blue-600">最低(℃)</div>`;

      dailyData.time.forEach((timeStr, index) => {
        const targetDate = new Date(timeStr);
        targetDate.setHours(0, 0, 0, 0);
        
        const diffDays = Math.round((targetDate - baseDate) / (1000 * 60 * 60 * 24));
        const isToday = (diffDays === 0);
        // 基準日を黄色でハイライト
        const cellBg = isToday ? 'bg-yellow-100 shadow-inner' : '';
        const borderClass = 'border-r border-slate-200 last:border-r-0';
        const dateDisplay = `${targetDate.getMonth() + 1}/${targetDate.getDate()}`;
        const cellClass = `flex-1 p-2 md:p-3 text-center flex flex-col justify-center ${borderClass} ${cellBg}`;
        
        // 日付の下に基準日テキストを追加（わかりやすさのため）
        const todayLabel = isToday ? '<div class="text-xs text-orange-600 mt-1">基準日</div>' : '';

        dateRow.innerHTML += `
          <div class="${cellClass}">
            <div class="font-bold text-slate-800 text-sm md:text-base">${dateDisplay}</div>
            ${todayLabel}
          </div>
        `;
        
        maxRow.innerHTML += `
          <div class="${cellClass} font-bold text-red-500 text-base md:text-lg">
            ${Math.round(dailyData.temperature_2m_max[index])}
          </div>
        `;
        
        minRow.innerHTML += `
          <div class="${cellClass} font-bold text-blue-500 text-base md:text-lg">
            ${Math.round(dailyData.temperature_2m_min[index])}
          </div>
        `;
      });

      tableContainer.appendChild(dateRow);
      tableContainer.appendChild(maxRow);
      tableContainer.appendChild(minRow);
    }

    // ==========================================
    // ドラッグ＆スワイプによる過去データ閲覧機能
    // ==========================================
    const scrollContainer = document.getElementById('scrollContainer');
    let isDown = false;
    let startScreenX = 0;
    let initialScrollLeft = 0;

    // --- 日付をずらす関数 ---
    function changeOffset(deltaDays) {
      let newOffset = currentOffset + deltaDays;
      // 制限：現在(0) 〜 7日前(左端が7日前になるのはオフセット-6) の間のみ移動可能
      if (newOffset < -6) newOffset = -6;
      if (newOffset > 0) newOffset = 0;
      
      if (newOffset !== currentOffset) {
        currentOffset = newOffset;
        updateDisplay();
        
        // 過去へ移動した時は左端にくっつけ、未来へ移動した時は右端にくっつけると自然な操作感になる
        if (deltaDays < 0) {
          scrollContainer.scrollLeft = 0;
        } else {
          scrollContainer.scrollLeft = scrollContainer.scrollWidth;
        }
      }
    }

    // --- 操作開始 ---
    function pointerDown(x, scrollL) {
      isDown = true;
      startScreenX = x;
      initialScrollLeft = scrollL;
      scrollContainer.classList.replace('cursor-grab', 'cursor-grabbing');
    }

    // --- 操作終了・スワイプ判定 ---
    function pointerUp(endScreenX) {
      if (!isDown) return;
      isDown = false;
      scrollContainer.classList.replace('cursor-grabbing', 'cursor-grab');

      const dx = endScreenX - startScreenX; 
      // dx > 0 : 右方向へ引っ張った（過去を見たい）
      // dx < 0 : 左方向へ引っ張った（未来を見たい）

      const threshold = 60; // 何px引っ張ったら1日動かすか

      // スマホ等の横スクロールと競合しないよう、「スクロールの端っこ」にいる時だけ日付を動かす
      const isAtLeftEdge = initialScrollLeft <= 5;
      const isAtRightEdge = initialScrollLeft >= (scrollContainer.scrollWidth - scrollContainer.clientWidth) - 5;

      if (isAtLeftEdge && dx > threshold) {
        // 左端でさらに右へ引っ張った → 過去へ
        const days = Math.floor(dx / threshold);
        changeOffset(-days);
      } else if (isAtRightEdge && dx < -threshold) {
        // 右端でさらに左へ引っ張った → 未来(現在)へ
        const days = Math.floor(Math.abs(dx) / threshold);
        changeOffset(days);
      }
    }

    // 【PC用】マウスイベント
    scrollContainer.addEventListener('mousedown', (e) => {
      pointerDown(e.pageX, scrollContainer.scrollLeft);
    });

    scrollContainer.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault(); 
      const x = e.pageX;
      const dx = x - startScreenX;
      // PCの場合はドラッグでコンテナの横スクロールも連動させる
      scrollContainer.scrollLeft = initialScrollLeft - dx;
    });

    scrollContainer.addEventListener('mouseup', (e) => { pointerUp(e.pageX); });
    scrollContainer.addEventListener('mouseleave', (e) => { if (isDown) pointerUp(e.pageX); });

    // 【スマホ用】タッチイベント
    scrollContainer.addEventListener('touchstart', (e) => {
      pointerDown(e.touches[0].clientX, scrollContainer.scrollLeft);
    }, {passive: true});

    // ※ touchmove はブラウザの滑らかなネイティブ横スクロールに任せる

    scrollContainer.addEventListener('touchend', (e) => {
      pointerUp(e.changedTouches[0].clientX);
    }, {passive: true});

  </script>
</body>
</html>
